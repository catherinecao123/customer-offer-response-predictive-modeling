[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-offer-response-predictive-modeling"
version = "2.0.0"
description = "Predict whether a Starbucks rewards customer will complete a promotional offer, from offer, demographic and event data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "nbconvert>=7",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so `from tests.conftest import ...` works under
# bare `pytest` (CI); `python -m pytest` adds it implicitly, `pytest` does not.
pythonpath = ["src", "."]
